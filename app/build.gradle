plugins { id 'com.android.application' }
android {
    namespace 'tj.navortj.app'
    compileSdk 35
    defaultConfig {
        applicationId 'tj.navortj.app'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'tj.navortj.app.SmokeTestRunner'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
